name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Native, WASM, and generated fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install native GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native targets
        run: cargo check --all-targets
      - name: Lint native targets
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Build release binary
        run: cargo build --release
      - name: Check builder WASM target
        run: cargo check --target wasm32-unknown-unknown
      - name: Materialize all-node generated fixture
        run: cargo run --example generate_fixture -- "${RUNNER_TEMP}/generated"
      - name: Check generated formatting
        run: cargo fmt --manifest-path "${RUNNER_TEMP}/generated/example-citizen/Cargo.toml" --all -- --check
      - name: Check generated native targets
        run: cargo check --manifest-path "${RUNNER_TEMP}/generated/example-citizen/Cargo.toml" --all-targets --all-features
      - name: Lint generated native targets
        run: cargo clippy --manifest-path "${RUNNER_TEMP}/generated/example-citizen/Cargo.toml" --all-targets --all-features -- -D warnings
      - name: Check generated WASM preview
        run: cargo check --manifest-path "${RUNNER_TEMP}/generated/example-citizen/Cargo.toml" --target wasm32-unknown-unknown --features preview --bin example-citizen-preview
